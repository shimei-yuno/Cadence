<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Cadence</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg:#1E2320;
    --bg-elevated:#252B26;
    --bg-card:#20261F;
    --ink:#E8E3D3;
    --ink-dim:#9BA096;
    --ink-faint:#6C7169;
    --rule:#38402F;
    --rule-soft:#2C3128;
    --amber:#D4A24C;
    --moss:#7C9473;
    --rust:#C06A50;
    --dusty:#7C93A6;
    --radius:3px;
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#F3EFE4;
    --bg-elevated:#FFFFFF;
    --bg-card:#FAF7EE;
    --ink:#2B2A22;
    --ink-dim:#6B6858;
    --ink-faint:#9C9884;
    --rule:#DCD5BF;
    --rule-soft:#E8E2CF;
    --amber:#B07E2A;
    --moss:#5C7A50;
    --rust:#B04B30;
    --dusty:#4C7185;
  }
  html{background:var(--bg);}
  body{transition:background-color .15s, color .15s;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }

  /* Layout: main column + weekday sidebar. Breakpoint is kept low (640px)
     on purpose so the sidebar stays beside the list at the app's default
     square-ish window size, and only drops below on genuinely narrow/mobile
     widths. */
  .appLayout{display:flex;gap:20px;max-width:900px;margin:0 auto;align-items:flex-start;padding:0 16px;}
  .wrap{flex:1 1 380px;min-width:280px;max-width:640px;margin:0;padding:24px 0 60px;}
  .daySidebar{width:190px;flex:0 0 190px;padding:24px 0 40px;position:sticky;top:16px;}
  @media (max-width:640px){
    .appLayout{flex-direction:column;padding:0 14px;}
    .wrap{max-width:none;width:100%;padding:20px 0 20px;}
    .daySidebar{width:100%;flex:none;position:static;padding:0 0 60px;}
  }
  .group-grid{display:flex;flex-direction:column;gap:10px;}
  /* When the daily sidebar is hidden, the task list would otherwise sit
     flush left in the leftover space — center it instead. */
  .appLayout.no-sidebar{justify-content:center;}
  .appLayout.no-sidebar .wrap{flex:0 1 640px;}

  /* Header */
  header.app{display:flex;flex-direction:column;gap:2px;margin-bottom:14px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand h1{
    font-family:'Zilla Slab',serif;font-weight:700;font-size:28px;letter-spacing:0.5px;
    margin:0;color:var(--ink);
  }
  .header-icon-btn{
    margin-left:auto;background:none;border:1px solid var(--rule);color:var(--ink-dim);
    font-size:14px;line-height:1;padding:7px 9px;border-radius:var(--radius);cursor:pointer;
  }
  .header-icon-btn:hover{color:var(--ink);border-color:var(--dusty);}

  /* Tabs (vault switcher) */
  .tabsbar{display:flex;align-items:flex-end;gap:4px;flex-wrap:wrap;margin-top:14px;}
  .tab{
    display:flex;align-items:center;justify-content:center;padding:9px 8px;border:1px solid var(--rule);
    border-radius:var(--radius);background:var(--bg-elevated);color:var(--ink-dim);font-size:12.5px;
    cursor:pointer;width:1in;text-align:center;
  }
  .tab.active{background:var(--bg-card);color:var(--ink);border-color:var(--dusty);}
  .tab.dragging{opacity:0.4;}
  .tab.drag-over{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber);}
  .tab .tabname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
  .tab.addtab{width:auto;color:var(--ink-faint);border-style:dashed;padding:9px 16px;}
  .tab.addtab:hover{color:var(--ink);border-color:var(--dusty);}
  .tabmenu{
    position:fixed;background:var(--bg-elevated);border:1px solid var(--rule);border-radius:var(--radius);
    display:flex;flex-direction:column;z-index:90;box-shadow:0 6px 20px rgba(0,0,0,.4);overflow:hidden;
  }
  .tabmenu button{
    background:none;border:none;color:var(--ink-dim);font-family:inherit;font-size:12px;padding:9px 14px;
    text-align:left;cursor:pointer;white-space:nowrap;
  }
  .tabmenu button:hover{background:var(--rule-soft);color:var(--ink);}
  .tabmenu button.danger-item{color:var(--rust);}

  /* Toolbar */
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 22px;}
  .toolbar .spacer{flex:1;}
  .toolbar button{
    background:none;border:1px solid var(--rule);color:var(--ink-dim);
    font-family:inherit;font-size:11px;padding:7px 10px;border-radius:var(--radius);cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .toolbar button:hover{border-color:var(--dusty);color:var(--ink);}
  .toolbar button.primary{
    background:var(--amber);color:#1E2320;border-color:var(--amber);font-weight:600;
  }
  .toolbar button.primary:hover{filter:brightness(1.08);}

  /* Section headers */
  .section{margin-bottom:26px;}
  .section-title{
    display:flex;align-items:center;gap:8px;
    font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-faint);
    margin:0 0 10px 2px;
  }
  .section-title .count{color:var(--ink-dim);}
  .section-title.overdue{color:var(--rust);}
  .section-title.today{color:var(--amber);}

  /* Group card */
  .group{
    border:1px solid var(--rule-soft);border-radius:var(--radius);background:var(--bg-card);
    margin-bottom:10px;overflow:hidden;
  }
  .group.overdue{border-color:#5A3B30;}
  .group-head{display:flex;align-items:flex-start;gap:10px;padding:12px;}
  .group-title-row{flex:1;min-width:0;}
  .group-title{
    font-family:'Zilla Slab',serif;font-size:16px;font-weight:600;color:var(--ink);
    cursor:pointer;word-break:break-word;
  }
  .group-title.struck{color:var(--ink-faint);text-decoration:line-through;}
  .badges{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;}
  .badge{
    font-size:10px;padding:2px 6px;border-radius:2px;letter-spacing:0.3px;
    border:1px solid var(--rule);color:var(--ink-dim);
  }
  .badge.cycle{border-color:#5C4A28;color:var(--amber);}
  .badge.overdue{border-color:#5A3B30;color:var(--rust);}
  .group-comment{
    padding:0 12px 8px 40px;font-size:12.5px;color:var(--ink-dim);white-space:pre-wrap;line-height:1.45;
  }
  .badge.today{border-color:#5C4A28;color:var(--amber);}
  .progress{font-size:11px;color:var(--ink-faint);white-space:nowrap;padding-top:2px;}
  .group-actions{display:flex;gap:4px;flex:none;}
  .icon-btn{
    background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:13px;padding:3px 5px;
    border-radius:2px;
  }
  .icon-btn:hover{color:var(--ink);background:var(--rule-soft);}

  .checkbox{
    width:15px;height:15px;flex:none;border:1.5px solid var(--ink-faint);border-radius:2px;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;margin-top:2px;
    font-size:10px;color:transparent;
  }
  .checkbox.checked{background:var(--moss);border-color:var(--moss);color:#1E2320;}

  .subtasks{padding:0 12px 10px 40px;display:flex;flex-direction:column;gap:5px;}
  .subtask{display:flex;align-items:flex-start;gap:8px;}
  .subtask .label{font-size:13.5px;color:var(--ink);cursor:pointer;}
  .subtask .label.struck{color:var(--ink-faint);text-decoration:line-through;}
  .subtask .due{font-size:10px;color:var(--ink-faint);white-space:nowrap;padding-top:2px;}
  .subtask .due.overdue{color:var(--rust);}
  .subtask .rm{margin-left:auto;color:var(--ink-faint);background:none;border:none;cursor:pointer;font-size:11px;visibility:hidden;}
  .subtask:hover .rm{visibility:visible;}
  .subtask-add-row{padding:2px 24px 12px 24px;}
  .subtask-add-input{
    width:100%;background:none;border:none;border-bottom:1px dashed var(--rule);color:var(--ink-dim);
    font-family:inherit;font-size:12.5px;padding:5px 0;
  }
  .subtask-add-input:focus{outline:none;border-color:var(--dusty);color:var(--ink);}

  .empty{
    text-align:center;color:var(--ink-faint);padding:40px 20px;border:1px dashed var(--rule);border-radius:var(--radius);
    font-size:13px;
  }

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(10,12,9,0.6);display:flex;align-items:flex-start;justify-content:center;
    padding:6vh 16px;z-index:50;overflow-y:auto;
  }
  .modal{
    background:var(--bg-elevated);border:1px solid var(--rule);border-radius:4px;max-width:460px;width:100%;
    padding:20px;
  }
  .modal h2{font-family:'Zilla Slab',serif;font-size:19px;margin:0 0 14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-faint);margin-bottom:5px;}
  .field input[type=text], .field input[type=date], .field select{
    width:100%;background:var(--bg-card);border:1px solid var(--rule);color:var(--ink);
    font-family:inherit;font-size:13.5px;padding:8px 9px;border-radius:2px;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--dusty);}
  .weekdays{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
  .wd{
    border:1px solid var(--rule);color:var(--ink-dim);font-size:11px;padding:5px 8px;border-radius:2px;
    cursor:pointer;background:none;font-family:inherit;
  }
  .wd.on{background:var(--amber);border-color:var(--amber);color:#1E2320;font-weight:600;}
  .day-btn-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
  .day-btn{
    border:1px solid var(--rule);color:var(--ink-dim);font-size:11px;padding:6px 10px;border-radius:2px;
    cursor:pointer;background:none;font-family:inherit;
  }
  .day-btn:hover{border-color:var(--dusty);color:var(--ink);}
  .day-btn.active{background:var(--amber);border-color:var(--amber);color:#1E2320;font-weight:600;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .hint-small{font-size:11px;color:var(--ink-faint);line-height:1.5;margin:-6px 0 4px;}
  .btn{border:1px solid var(--rule);background:none;color:var(--ink-dim);font-family:inherit;font-size:12.5px;
    padding:8px 14px;border-radius:2px;cursor:pointer;}
  .btn:hover{color:var(--ink);border-color:var(--dusty);}
  .btn.primary{background:var(--amber);border-color:var(--amber);color:#1E2320;font-weight:600;}
  .btn.danger{color:var(--rust);}

  /* Subtask editor (lives inside the edit/new-task modal only) */
  .sub-editor{display:flex;flex-direction:column;gap:5px;margin-bottom:6px;}
  .sub-row{display:flex;align-items:center;gap:7px;}
  .sub-row input[type=text]{
    flex:1;background:var(--bg-card);border:1px solid var(--rule);color:var(--ink);
    font-family:inherit;font-size:12.5px;padding:5px 7px;border-radius:2px;
  }
  .sub-row input[type=text]:focus{outline:none;border-color:var(--dusty);}
  .sub-row .rm{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:11px;padding:2px 4px;}
  .sub-row .rm:hover{color:var(--rust);}
  .sub-due-btn{
    flex:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;
    background:var(--bg-card);border:1px solid var(--rule);color:var(--ink-faint);border-radius:2px;
    cursor:pointer;font-size:13px;padding:0;line-height:1;
  }
  .sub-due-btn:hover{color:var(--ink);border-color:var(--dusty);}
  .sub-due-btn.has-due{color:var(--amber);border-color:#5C4A28;}
  .due-popover{padding:10px;}
  .due-popover-inner{display:flex;flex-direction:column;gap:8px;}
  .due-popover input[type=datetime-local]{
    background:var(--bg-card);border:1px solid var(--rule);color:var(--ink);
    font-family:inherit;font-size:12px;padding:6px 7px;border-radius:2px;
  }
  .due-popover input[type=datetime-local]:focus{outline:none;border-color:var(--dusty);}
  .due-popover-actions{display:flex;justify-content:space-between;gap:8px;}
  .due-popover-actions button{
    background:none;border:1px solid var(--rule);color:var(--ink-dim);font-family:inherit;
    font-size:11px;padding:5px 10px;border-radius:2px;cursor:pointer;
  }
  .due-popover-actions button:hover{color:var(--ink);border-color:var(--dusty);}
  .due-popover-actions button.primary{background:var(--amber);border-color:var(--amber);color:#1E2320;font-weight:600;}
  .sub-empty{font-size:11.5px;color:var(--ink-faint);font-style:italic;margin-bottom:6px;}
  .sub-add-input{
    width:100%;background:none;border:none;border-bottom:1px dashed var(--rule);color:var(--ink-dim);
    font-family:inherit;font-size:12.5px;padding:5px 0;
  }
  .sub-add-input:focus{outline:none;border-color:var(--dusty);color:var(--ink);}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg-elevated);
    border:1px solid var(--moss);color:var(--ink);padding:9px 16px;border-radius:3px;font-size:12.5px;
    box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:80;opacity:0;transition:opacity .2s, transform .2s;
    pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  ::selection{background:var(--amber);color:#1E2320;}

  /* Weekday sidebar — per-day tasklists, unrelated to the main task list, saved per file */
  .day-col{border:1px solid var(--rule-soft);border-radius:var(--radius);background:var(--bg-card);margin-bottom:8px;padding:8px 9px;}
  .day-col.is-today{border-color:#5C4A28;}
  .day-head{font-family:'Zilla Slab',serif;font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .today-mark{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.5px;text-transform:uppercase;color:var(--amber);border:1px solid #5C4A28;padding:1px 5px;border-radius:2px;}
  .day-tasklist{display:flex;flex-direction:column;gap:5px;min-height:10px;}
  .day-task{display:flex;align-items:flex-start;gap:7px;}
  .day-task .label{font-size:12px;color:var(--ink);cursor:pointer;word-break:break-word;}
  .day-task .label.struck{color:var(--ink-faint);text-decoration:line-through;}
  .day-empty{font-size:11.5px;color:var(--ink-faint);font-style:italic;}

  @media (max-width:480px){
    .brand h1{font-size:23px;}
  }

  /* ---- v1.12: native controls, scrollbars and dialogs follow the app theme ----
     color-scheme (set on :root above) makes the browser draw its own pieces —
     select dropdowns, the date/time pickers, form controls — in the matching
     light or dark style. */
  select option, select optgroup{background:var(--bg-elevated);color:var(--ink);}
  ::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.8;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--rule);border-radius:10px;border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:var(--ink-faint);border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-corner{background:transparent;}
  @supports not selector(::-webkit-scrollbar){ *{scrollbar-width:thin;scrollbar-color:var(--rule) transparent;} }

  .brand h1 .app-version{
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:400;letter-spacing:.3px;
    color:var(--ink-faint);margin-left:8px;
  }

  /* themed confirm dialog (replaces the browser's native confirm box) */
  .confirm-msg{margin:0 0 4px;color:var(--ink-dim);font-size:13.5px;line-height:1.5;word-break:break-word;}
  .btn.danger-fill{background:var(--rust);border-color:var(--rust);color:#fff;font-weight:600;}
  .btn.danger-fill:hover{filter:brightness(1.08);color:#fff;}

  /* sections: sort button, pinned, hidden note */
  .section-title .grow{flex:1;}
  .section-title.pinned{color:var(--amber);}
  .sort-btn{
    background:none;border:1px solid transparent;color:var(--ink-faint);font-family:inherit;font-size:10.5px;
    letter-spacing:.5px;text-transform:uppercase;padding:3px 7px;border-radius:2px;cursor:pointer;
  }
  .sort-btn:hover{color:var(--ink);border-color:var(--rule);}
  .hidden-note{font-size:11.5px;color:var(--ink-faint);text-align:center;margin:4px 0 18px;line-height:1.6;}
  .hidden-note button{background:none;border:none;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;padding:0;}
  .hidden-note button:hover{color:var(--ink);}

  /* pin button + manual-order drag handle on cards */
  .icon-btn.pin{opacity:.4;filter:grayscale(1);}
  .icon-btn.pin:hover{opacity:.9;}
  .icon-btn.pin.on{opacity:1;filter:none;}
  .icon-btn.handle{cursor:grab;letter-spacing:-2px;}
  .group.dragging{opacity:.4;}
  .group.drop-before{box-shadow:0 -2px 0 0 var(--amber);}
  .group.drop-after{box-shadow:0 2px 0 0 var(--amber);}

  /* settings: show/hide sections */
  .field .check-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:2px;}
  .field .check{
    display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;
    color:var(--ink);cursor:pointer;margin:0;
  }

  /* update checker */
  .cdu-banner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:9px 12px;
    border:1px solid var(--amber);border-radius:3px;background:var(--bg-card);color:var(--ink);font-size:12.5px;}
  .cdu-banner .cdu-msg{flex:1;min-width:160px;}
  .cdu-banner .btn{padding:6px 11px;font-size:12px;}
  .cdu-footer{margin-top:28px;text-align:center;font-size:11.5px;color:var(--ink-faint);}
  .cdu-footer button{background:none;border:none;color:inherit;font:inherit;cursor:pointer;text-decoration:underline;padding:0;}
  .cdu-footer button:hover{color:var(--ink);}
  .cdu-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:4px 0;}
  .cdu-row span:first-child{color:var(--ink-faint);}
  .cdu-status{margin:12px 0 2px;font-size:12.5px;color:var(--ink-dim);line-height:1.5;}
  .btn:disabled{opacity:.5;cursor:default;}
</style>
</head>
<body>
<div class="appLayout" id="appLayout">
  <div class="wrap">

    <header class="app">
      <div class="brand">
        <h1>Cadence<small class="app-version" id="appVersion"></small></h1>
        <button class="header-icon-btn" id="btnSettings" title="Settings">⚙</button>
      </div>
      <div class="tabsbar" id="tabsbar"></div>
    </header>

    <div class="toolbar" id="toolbar">
      <button class="primary" id="btnAdd">+ New task</button>
      <button id="btnQuickAdd">Quick add</button>
      <div class="spacer"></div>
      <span id="vaultActions"></span>
    </div>

    <div id="renderedView"></div>

    <input type="file" id="fileImportInput" accept=".md,.txt" style="display:none;">
  </div>

  <aside class="daySidebar" id="daySidebar"></aside>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------------------------------------------------------
   CADENCE — file-backed recurring checklist
   Data for the ACTIVE vault lives entirely in a plain-text markdown
   file (tasks.md): task groups (heading + hidden metadata comment +
   checklist), plus a small hidden metadata comment holding the
   Mon-Fri sidebar notes (plain free-text, unrelated to tasks).

   Multiple vault files can be tracked at once (see the tabs bar) —
   each tab points at its own file/handle, its own local cache, and
   its own sidebar notes. Only the ACTIVE tab's data lives in `tasks`
   / `sidebarNotes` below at any given moment.
--------------------------------------------------------------- */

const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// Shown in the header when there's no Electron bridge to ask (Android / a
// plain browser). Keep in step with "version" in package.json.
const APP_VERSION_FALLBACK = '1.12.0';
let appVersion = APP_VERSION_FALLBACK;
const SECTION_DEFS = [
  ['pinned','Pinned'], ['nodeadline','No Deadline'], ['today','Today'], ['thisweek','This Week'],
  ['nextweek','Next Week'], ['nextmonth','Next Month'], ['completed','Completed']
];
const SORT_MODES = [['manual','Manual'], ['alpha','Alphabetical'], ['deadline','Deadline']];
function defaultViewPrefs(){ return {sort:{}, hidden:[]}; }
function normViewPrefs(raw){
  const out = defaultViewPrefs();
  if(!raw || typeof raw !== 'object') return out;
  const keys = SECTION_DEFS.map(d=>d[0]), modes = SORT_MODES.map(m=>m[0]);
  if(raw.sort && typeof raw.sort === 'object'){
    for(const k of keys){ if(modes.includes(raw.sort[k])) out.sort[k] = raw.sort[k]; }
  }
  if(Array.isArray(raw.hidden)) out.hidden = raw.hidden.filter(k => keys.includes(k));
  return out;
}
function sortModeFor(key){ return viewPrefs.sort[key] || 'manual'; }
const DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_LABELS = {mon:'Mon', tue:'Tue', wed:'Wed', thu:'Thu', fri:'Fri', sat:'Sat', sun:'Sun'};
const DOW_TO_KEY = ['sun','mon','tue','wed','thu','fri','sat'];

let tasks = [];              // array of group objects — belongs to the ACTIVE vault
let sidebarNotes = defaultNotes(); // {mon..sun} -> array of {id,text,done} tasklist items — belongs to the ACTIVE vault
let dayResetTime = '00:00';  // HH:MM — when the sidebar's "today" flips to the next day; per-vault
let completedTtlHours = 0;   // hours after completion before a task auto-deletes; 0 = never; per-vault
let hideDailySidebar = false; // per-vault: hide the weekday tasklist sidebar for this tab
let hideSubtaskBar = false;  // per-vault: hide the inline "add subtask" row on task cards
let viewPrefs = defaultViewPrefs();  // per-vault: {sort:{<section>:'manual'|'alpha'|'deadline'}, hidden:[<section>,...]}
let dayWeekAnchor = {};      // per-vault: {mon:'2026-08-24', ...} — which week's Monday each weekday's tasklist was last reset for
let vaults = [];             // [{id, name, path?}] — path is set for native-tracked vaults
let activeVaultId = null;
let fsaHandles = new Map();  // FSA (browser) mode only: vault id -> FileSystemFileHandle, in-memory
let editingId = null;

const hasFSA = 'showOpenFilePicker' in window;
const hasNative = !!window.cadenceBridge;  // true inside the Electron app

function defaultNotes(){ return {mon:[], tue:[], wed:[], thu:[], fri:[], sat:[], sun:[]}; }
function activeVault(){ return vaults.find(v => v.id === activeVaultId) || null; }
function cacheKey(id){ return 'cadence_cache_' + id; }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- date helpers (ISO yyyy-mm-dd, local) ----------
function todayISO(){ const d=new Date(); return isoOf(d); }
function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDaysISO(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return isoOf(d); }
function addMonthsISO(s,n){ const d=parseISO(s); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n);
  const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return isoOf(d); }
function nextWeekdayISO(fromISO, days){
  if(!days || !days.length) return addDaysISO(fromISO,7);
  for(let i=1;i<=14;i++){ const cand=addDaysISO(fromISO,i); if(days.includes(parseISO(cand).getDay())) return cand; }
  return addDaysISO(fromISO,7);
}
function fmtDate(iso){
  if(!iso) return '';
  const d=parseISO(iso);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
// ---- time-of-day (24h "HH:MM") helpers — the reset/due clock time ----
function dueDateTime(g){
  const [hh,mm] = (g.time || '00:00').split(':').map(Number);
  const d = parseISO(g.due);
  d.setHours(hh, mm, 0, 0);
  return d;
}
function fmtTime(t){
  if(!t) return '';
  const [hh,mm] = t.split(':').map(Number);
  const period = hh>=12 ? 'PM' : 'AM';
  let h12 = hh % 12; if(h12===0) h12 = 12;
  return h12 + ':' + String(mm).padStart(2,'0') + ' ' + period;
}
function fmtDueBadge(g){
  if(!g.due) return '';
  let s = fmtDate(g.due);
  if(g.time && g.time !== '00:00') s += ', ' + fmtTime(g.time);
  return s;
}
// ---- subtask deadlines use <input type="datetime-local"> ("YYYY-MM-DDTHH:MM"),
// so they carry both a date and a time, unlike the main due-date field. The
// string format sorts/compares correctly with plain < / <= (same trick ISO
// dates use), so no need to parse into Date objects just to compare "now".
function nowLocalStr(){
  const d = new Date();
  return isoOf(d) + 'T' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function fmtDateTime(dtLocal){
  if(!dtLocal) return '';
  const [datePart, timePart] = dtLocal.split('T');
  let s = fmtDate(datePart);
  if(timePart && timePart !== '00:00') s += ', ' + fmtTime(timePart);
  return s;
}
function uid(){ return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4); }

// ---------- theme (light / dark / follow system) — a UI preference, not
// vault data, so it lives in localStorage rather than the markdown file.
// Picked from a dropdown inside Tab settings (see openTabSettings). ----------
let themeMode = localStorage.getItem('cadence_theme') || 'system';
function resolvedTheme(){
  if(themeMode === 'system') return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  return themeMode;
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', resolvedTheme());
}
function setThemeMode(mode){
  themeMode = mode;
  localStorage.setItem('cadence_theme', mode);
  applyTheme();
}
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', ()=>{ if(themeMode==='system') applyTheme(); });
}
applyTheme();

// ---------- base64 helpers (unicode-safe) for embedding sidebar notes ----------
function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64decode(str){ return decodeURIComponent(escape(atob(str))); }

// ---------- serialize / parse ----------
function serialize(){
  let out = '# Cadence tasks\n\n';
  out += '<!-- sidebar-notes: ' + b64encode(JSON.stringify(sidebarNotes)) + ' -->\n';
  out += '<!-- day-reset-time: ' + (dayResetTime || '00:00') + ' -->\n';
  out += '<!-- completed-ttl: ' + (completedTtlHours || 0) + ' -->\n';
  out += '<!-- hide-daily: ' + (hideDailySidebar ? 1 : 0) + ' -->\n';
  out += '<!-- hide-subtask-bar: ' + (hideSubtaskBar ? 1 : 0) + ' -->\n';
  out += '<!-- day-week-anchor: ' + b64encode(JSON.stringify(dayWeekAnchor)) + ' -->\n';
  out += '<!-- view-prefs: ' + b64encode(JSON.stringify(viewPrefs)) + ' -->\n\n';
  for(const g of tasks){
    out += '## ' + g.title + '\n';
    const subDue = {};
    for(const s of g.subtasks){ if(s.due) subDue[s.title] = s.due; }
    const meta = {
      id:g.id, repeat:g.repeat, days:g.days||[], due:g.due, time:g.time||'00:00',
      history:g.history||[], archived: !!g.archived, completed: !!g.completed,
      completedAt: g.completedAt || null, comment: g.comment || '', pinned: !!g.pinned, subDue
    };
    out += '<!-- meta: ' + JSON.stringify(meta) + ' -->\n';
    for(const s of g.subtasks){
      out += '- [' + (s.done?'x':' ') + '] ' + s.title + '\n';
    }
    out += '\n';
  }
  return out;
}
// Migrates the old free-text weekday notes (a plain string per day) into the
// new tasklist shape (an array of {id,text,done} per day) — one line per item.
function migrateNotes(raw){
  const notes = defaultNotes();
  for(const key of DAY_KEYS){
    const v = raw ? raw[key] : undefined;
    if(Array.isArray(v)){
      notes[key] = v.map(it => ({id: it.id || uid(), text: String(it.text||''), done: !!it.done})).filter(it=>it.text.trim());
    } else if(typeof v === 'string' && v.trim()){
      notes[key] = v.split(/\r?\n/).map(t=>t.trim()).filter(Boolean).map(t=>({id:uid(), text:t, done:false}));
    }
  }
  return notes;
}
function parseFile(text){
  const lines = text.split(/\r?\n/);
  const groups = [];
  let rawNotes = null;
  let resetTime = '00:00';
  let ttl = 0;
  let hideDaily = false;
  let hideSubBar = false;
  let weekAnchor = null;
  let rawViewPrefs = null;
  let cur = null;
  for(const line of lines){
    const sb = line.match(/^<!--\s*sidebar-notes:\s*([A-Za-z0-9+/=]+)\s*-->$/);
    const rt = line.match(/^<!--\s*day-reset-time:\s*(\d{1,2}:\d{2})\s*-->$/);
    const ttlm = line.match(/^<!--\s*completed-ttl:\s*(\d+)\s*-->$/);
    const hdm = line.match(/^<!--\s*hide-daily:\s*([01])\s*-->$/);
    const hsm = line.match(/^<!--\s*hide-subtask-bar:\s*([01])\s*-->$/);
    const wam = line.match(/^<!--\s*day-week-anchor:\s*([A-Za-z0-9+/=]+)\s*-->$/);
    const vpm = line.match(/^<!--\s*view-prefs:\s*([A-Za-z0-9+/=]+)\s*-->$/);
    const h = line.match(/^##\s+(.*)$/);
    const m = line.match(/^<!--\s*meta:\s*(\{.*\})\s*-->$/);
    const c = line.match(/^-\s*\[([ xX])\]\s*(.*)$/);
    if(sb){
      try{ rawNotes = JSON.parse(b64decode(sb[1])); }catch(e){}
    } else if(rt){
      resetTime = rt[1];
    } else if(ttlm){
      ttl = Number(ttlm[1]) || 0;
    } else if(hdm){
      hideDaily = hdm[1] === '1';
    } else if(hsm){
      hideSubBar = hsm[1] === '1';
    } else if(wam){
      try{ weekAnchor = JSON.parse(b64decode(wam[1])); }catch(e){}
    } else if(vpm){
      try{ rawViewPrefs = JSON.parse(b64decode(vpm[1])); }catch(e){}
    } else if(h){
      cur = {id:uid(), title:h[1].trim(), repeat:'none', days:[], due:null, time:'00:00', history:[], archived:false, completed:false, pinned:false, completedAt:null, comment:'', subtasks:[], _subDue:{}};
      groups.push(cur);
    } else if(m && cur){
      try{
        const meta = JSON.parse(m[1]);
        cur.id = meta.id || cur.id;
        cur.repeat = meta.repeat || 'none';
        cur.days = meta.days || [];
        cur.due = meta.due || null;
        cur.time = meta.time || '00:00';
        cur.history = meta.history || [];
        cur.archived = !!meta.archived;
        cur.completed = !!meta.completed;
        cur.completedAt = meta.completedAt || null;
        cur.comment = meta.comment || '';
        cur.pinned = !!meta.pinned;
        cur._subDue = meta.subDue || {};
      }catch(e){}
    } else if(c && cur){
      const title = c[2].trim();
      const due = cur._subDue[title] || null;
      cur.subtasks.push({id:uid(), title, done: c[1].toLowerCase()==='x', due});
    }
  }
  for(const g of groups) delete g._subDue;
  return {tasks: groups, sidebarNotes: migrateNotes(rawNotes), dayResetTime: resetTime, completedTtlHours: ttl, hideDailySidebar: hideDaily, hideSubtaskBar: hideSubBar, dayWeekAnchor: weekAnchor || {}, viewPrefs: normViewPrefs(rawViewPrefs)};
}

// ---------- status / grouping ----------
function groupStatus(g){
  if(g.archived) return 'archived';
  if(!g.due) return 'anytime';
  const due = dueDateTime(g);
  const now = new Date();
  if(g.repeat === 'none'){
    if(due < now) return 'overdue';
    if(g.due === todayISO()) return 'today';
    return 'upcoming';
  }
  if(due <= now) return 'today';
  if(g.due === todayISO()) return 'today';
  return 'upcoming';
}
// Maps each task onto one of the 5 date-based sections (plus a trailing
// Completed section for finished non-repeating tasks).
function sectionBucket(g){
  if(g.pinned) return 'pinned';
  if(g.archived) return 'completed';
  if(!g.due) return 'nodeadline';
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diffDays = Math.round((parseISO(g.due) - todayStart) / 86400000);
  if(dueDateTime(g) <= now || diffDays <= 0) return 'today';
  if(diffDays <= 7) return 'thisweek';
  if(diffDays <= 14) return 'nextweek';
  return 'nextmonth';
}
function progressOf(g){
  if(!g.subtasks.length) return null;
  const done = g.subtasks.filter(s=>s.done).length;
  return {done, total: g.subtasks.length};
}
function repeatLabel(g){
  const t = (g.time && g.time!=='00:00') ? (' ' + fmtTime(g.time)) : '';
  if(g.repeat==='daily') return '↻ daily' + t;
  if(g.repeat==='weekly') return '↻ weekly · ' + (g.days.length? g.days.slice().sort().map(d=>WD[d]).join(' ') : '') + t;
  if(g.repeat==='monthly') return '↻ monthly' + t;
  return null;
}

// ---------- mutations ----------
function markSubtaskDone(g, s, done){
  s.done = done;
  const allDone = g.subtasks.length>0 && g.subtasks.every(x=>x.done);
  if(g.repeat==='none'){
    if(allDone && g.subtasks.length>0){
      g.archived = true;
      g.completedAt = Date.now();
      toast('Task completed');
    } else if(!done && g.archived){
      g.archived = false;
      g.completedAt = null;
    }
  } else {
    // Repeating tasks: finishing every subtask marks the main task
    // completed too (mirrors the main checkbox), but — same as before —
    // this doesn't advance the due date immediately; it just stays
    // checked until the scheduled reset (runAutoResets) rolls the cycle
    // forward on its own.
    if(allDone && g.subtasks.length>0){
      g.completed = true;
    } else if(!done && g.completed){
      g.completed = false;
    }
  }
  save();
}
function completeCycle(g, opts={}){
  const wasCompleted = g.completed || g.subtasks.length===0 || g.subtasks.every(s=>s.done);
  const base = g.due || todayISO();
  let next;
  if(g.repeat==='daily') next = addDaysISO(base,1);
  else if(g.repeat==='weekly') next = nextWeekdayISO(base, g.days);
  else if(g.repeat==='monthly') next = addMonthsISO(base,1);
  else next = null;
  g.history = g.history || [];
  g.history.push(base);
  g.due = next;
  g.subtasks.forEach(s=>s.done=false);
  g.completed = false;
  if(!opts.silent){
    toast((wasCompleted ? 'Cycle complete' : 'Reset for new cycle') + ' — next due ' + fmtDueBadge(g));
  }
}
function runAutoResets(announce){
  checkWeeklySidebarReset();
  const now = new Date();
  let resetCount = 0;
  let healed = false;
  for(const g of tasks){
    if(g.repeat==='none') continue;
    // A repeating task with no due date would never hit the reset check
    // below and could sit "completed" forever — always give it one.
    if(!g.due){ g.due = todayISO(); healed = true; }
    let iterations = 0;
    while(dueDateTime(g) <= now && iterations < 366){
      completeCycle(g, {silent:true});
      iterations++;
    }
    if(iterations>0) resetCount++;
  }
  if(resetCount>0 || healed) save();
  if(resetCount>0 && announce) toast(resetCount===1 ? 'A task reset for its new cycle' : resetCount + ' tasks reset for a new cycle');
}
function toggleGroupDone(g){
  if(g.repeat!=='none'){
    // Mark done for this cycle without advancing the due date — same
    // reasoning as markSubtaskDone above. The actual cycle rollover only
    // happens once the scheduled reset time arrives.
    g.completed = !g.completed;
    g.subtasks.forEach(s=> s.done = g.completed);
  } else {
    g.archived = !g.archived;
    g.completedAt = g.archived ? Date.now() : null;
    g.subtasks.forEach(s=>s.done = g.archived);
  }
  save();
}
function deleteGroup(id){ tasks = tasks.filter(g=>g.id!==id); save(); }
function removeSubtask(g, sid){ g.subtasks = g.subtasks.filter(s=>s.id!==sid); save(); }
let refocusSubtaskBarId = null;
function addSubtaskInline(g, title){
  title = (title||'').trim();
  if(!title) return;
  g.subtasks.push({id:uid(), title, done:false, due:null});
  refocusSubtaskBarId = g.id;   // put the cursor back in this card's bar once the list redraws
  save();
}
// The list is rebuilt after every change, which would normally drop the
// cursor; this puts it back in the bar the person was just typing into.
function restoreSubtaskFocus(){
  if(!refocusSubtaskBarId) return;
  const id = refocusSubtaskBarId;
  refocusSubtaskBarId = null;
  const inp = document.querySelector('.subtask-add-input[data-gid="' + id + '"]');
  if(inp) inp.focus();
}
// Deletes archived (completed) tasks whose completedAt is older than this
// vault's configured TTL. No-op when the TTL is set to "Never" (0).
function runCompletedCleanup(){
  if(!completedTtlHours) return;
  const cutoff = Date.now() - completedTtlHours*3600*1000;
  const before = tasks.length;
  tasks = tasks.filter(g => !(g.archived && g.completedAt && g.completedAt <= cutoff));
  if(tasks.length !== before) save();
}

// ---------- rendering ----------
function render(){
  renderList();
  restoreSubtaskFocus();
  renderSidebar();
  renderTabsBar();
  renderVaultActions();
}
function sortSectionItems(items, mode){
  const byTitle = (x, y) => x.title.localeCompare(y.title, undefined, {sensitivity:'base', numeric:true});
  if(mode === 'alpha') return [...items].sort(byTitle);
  if(mode === 'deadline'){
    const when = (g) => g.due ? dueDateTime(g).getTime() : Infinity;   // no deadline sorts last
    return [...items].sort((x, y) => {
      const a = when(x), b = when(y);
      if(a !== b) return a < b ? -1 : 1;
      return byTitle(x, y);
    });
  }
  return items;   // manual: the order tasks are stored in
}
function togglePin(g){ g.pinned = !g.pinned; save(); }
// Manual ordering: put task `dragId` just before/after task `targetId`.
function moveTask(dragId, targetId, after){
  if(dragId === targetId) return false;
  const from = tasks.findIndex(t => t.id === dragId);
  if(from < 0) return false;
  const [moved] = tasks.splice(from, 1);
  const to = tasks.findIndex(t => t.id === targetId);
  if(to < 0){ tasks.splice(from, 0, moved); return false; }
  tasks.splice(after ? to + 1 : to, 0, moved);
  return true;
}
let dragTask = null;
function clearDropMarks(){
  document.querySelectorAll('.group.dragging, .group.drop-before, .group.drop-after')
    .forEach(n => n.classList.remove('dragging', 'drop-before', 'drop-after'));
}
function openSortMenu(anchor, key){
  closeAnyMenu();
  const menu = document.createElement('div');
  menu.className = 'tabmenu';
  const cur = sortModeFor(key);
  for(const [mode, label] of SORT_MODES){
    const b = document.createElement('button');
    b.dataset.mode = mode;
    b.textContent = (mode === cur ? '✓ ' : '\u00a0\u00a0 ') + label;
    b.onclick = () => { viewPrefs.sort[key] = mode; menu.remove(); save(); };
    menu.appendChild(b);
  }
  const r = anchor.getBoundingClientRect();
  positionMenu(menu, r.left + window.scrollX, r.bottom + window.scrollY + 4);
}
function renderList(){
  const root = document.getElementById('renderedView');
  root.innerHTML = '';
  if(!tasks.length){
    root.innerHTML = '<div class="empty">No tasks yet. Add one, or open an existing vault file.</div>';
    return;
  }
  const buckets = {};
  for(const [k] of SECTION_DEFS) buckets[k] = [];
  for(const g of tasks) buckets[sectionBucket(g)].push(g);

  let hiddenCount = 0;
  const hiddenNames = [];
  for(const [key, label] of SECTION_DEFS){
    const raw = buckets[key];
    if(!raw.length) continue;
    if(viewPrefs.hidden.includes(key)){ hiddenCount += raw.length; hiddenNames.push(label); continue; }
    const mode = sortModeFor(key);
    const items = sortSectionItems(raw, mode);
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.dataset.section = key;
    const title = document.createElement('div');
    title.className = 'section-title' + (key === 'today' ? ' today' : key === 'pinned' ? ' pinned' : '');
    title.innerHTML = `${label} <span class="count">(${items.length})</span><span class="grow"></span>`;
    const sortBtn = document.createElement('button');
    sortBtn.className = 'sort-btn';
    sortBtn.textContent = '⇅ ' + SORT_MODES.find(m => m[0] === mode)[1];
    sortBtn.title = 'Sort this section';
    sortBtn.onclick = () => openSortMenu(sortBtn, key);
    title.appendChild(sortBtn);
    sec.appendChild(title);
    const grid = document.createElement('div');
    grid.className = 'group-grid';
    for(const g of items) grid.appendChild(renderGroup(g, key, mode === 'manual'));
    sec.appendChild(grid);
    root.appendChild(sec);
  }
  if(hiddenCount > 0){
    const note = document.createElement('div');
    note.className = 'hidden-note';
    note.appendChild(document.createTextNode(
      hiddenCount + (hiddenCount === 1 ? ' task is' : ' tasks are') + ' in hidden sections (' + hiddenNames.join(', ') + '). '));
    const link = document.createElement('button');
    link.textContent = 'Change in Settings';
    link.onclick = openTabSettings;
    note.appendChild(link);
    root.appendChild(note);
  }
}
// Main page shows each task group's title, badges, progress count, and its
// subtasks (checkable, removable, with an inline add row so you don't need
// the edit modal just to add one more subtask) — full subtask CRUD including
// deadlines still lives in the edit modal too.
function renderGroup(g, sectionKey, manualOrder){
  const el = document.createElement('div');
  el.className = 'group' + (groupStatus(g)==='overdue' ? ' overdue' : '');
  const prog = progressOf(g);
  const status = groupStatus(g);
  const isDone = g.repeat==='none' ? !!g.archived : !!g.completed;

  const head = document.createElement('div');
  head.className = 'group-head';

  const cb = document.createElement('div');
  cb.className = 'checkbox' + (isDone ? ' checked':'');
  cb.textContent = isDone ? '✓' : '';
  cb.title = g.repeat!=='none' ? 'Mark done for this cycle' : 'Mark done';
  cb.onclick = ()=> toggleGroupDone(g);
  head.appendChild(cb);

  const titleWrap = document.createElement('div');
  titleWrap.className = 'group-title-row';
  const titleEl = document.createElement('div');
  titleEl.className = 'group-title' + (isDone ? ' struck':'');
  titleEl.textContent = g.title;
  titleEl.onclick = ()=> openEdit(g.id);
  titleWrap.appendChild(titleEl);

  const badges = document.createElement('div');
  badges.className = 'badges';
  const rl = repeatLabel(g);
  if(rl) badges.innerHTML += `<span class="badge cycle">${rl}</span>`;
  if(g.due) badges.innerHTML += `<span class="badge ${status==='overdue'?'overdue':status==='today'?'today':''}">due ${fmtDueBadge(g)}</span>`;
  titleWrap.appendChild(badges);
  head.appendChild(titleWrap);

  if(prog){
    const p = document.createElement('div');
    p.className = 'progress';
    p.textContent = prog.done + '/' + prog.total;
    p.title = 'Edit to check off subtasks';
    head.appendChild(p);
  }

  const actions = document.createElement('div');
  actions.className = 'group-actions';
  const mkBtn = (cls, text, title) => {
    const b = document.createElement('button');
    b.className = 'icon-btn' + (cls ? ' ' + cls : '');
    b.textContent = text;
    b.title = title;
    return b;
  };
  if(manualOrder){
    // Only the handle starts a drag, so selecting text in the card still works.
    const handle = mkBtn('handle', '⋮⋮', 'Drag to reorder');
    handle.onmousedown = () => { el.draggable = true; };
    handle.onmouseup = () => { el.draggable = false; };
    actions.appendChild(handle);
  }
  const pinBtn = mkBtn('pin' + (g.pinned ? ' on' : ''), '📌', g.pinned ? 'Unpin' : 'Pin to the top');
  pinBtn.onclick = () => togglePin(g);
  actions.appendChild(pinBtn);
  const editBtn = mkBtn('', '✎', 'Edit');
  editBtn.onclick = () => openEdit(g.id);
  actions.appendChild(editBtn);
  const delBtn = mkBtn('', '✕', 'Delete');
  // Completed tasks skip the "are you sure" — they're already done, so
  // deleting one is low-stakes and shouldn't need a confirm dialog.
  delBtn.onclick = async () => {
    if(g.archived || await askConfirm({
      title: 'Delete task?',
      message: '\u201c' + g.title + '\u201d will be deleted. This cannot be undone.',
      confirmLabel: 'Delete'
    })) deleteGroup(g.id);
  };
  actions.appendChild(delBtn);
  head.appendChild(actions);

  if(manualOrder){
    el.ondragstart = (e) => {
      dragTask = {id: g.id, section: sectionKey};
      el.classList.add('dragging');
      if(e.dataTransfer){
        e.dataTransfer.effectAllowed = 'move';
        try{ e.dataTransfer.setData('text/plain', g.id); }catch(_){}
      }
    };
    el.ondragend = () => { dragTask = null; el.draggable = false; clearDropMarks(); };
    const overHalf = (e) => { const r = el.getBoundingClientRect(); return (e.clientY - r.top) > r.height / 2; };
    el.ondragover = (e) => {
      if(!dragTask || dragTask.section !== sectionKey || dragTask.id === g.id) return;
      e.preventDefault();
      if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      const after = overHalf(e);
      el.classList.toggle('drop-after', after);
      el.classList.toggle('drop-before', !after);
    };
    el.ondragleave = () => el.classList.remove('drop-before', 'drop-after');
    el.ondrop = (e) => {
      if(!dragTask || dragTask.section !== sectionKey || dragTask.id === g.id) return;
      e.preventDefault();
      const id = dragTask.id, after = overHalf(e);
      dragTask = null;
      clearDropMarks();
      if(moveTask(id, g.id, after)) save();
    };
  }

  el.appendChild(head);

  // Comment: hidden entirely when empty, shown below the title/badges and
  // above the subtasks when there's content.
  if(g.comment && g.comment.trim()){
    const cm = document.createElement('div');
    cm.className = 'group-comment';
    cm.textContent = g.comment;
    el.appendChild(cm);
  }

  const subs = document.createElement('div');
  subs.className = 'subtasks';
  const nowStr = nowLocalStr();
  for(const s of g.subtasks){
    const row = document.createElement('div');
    row.className = 'subtask';
    const scb = document.createElement('div');
    scb.className = 'checkbox' + (s.done?' checked':'');
    scb.textContent = s.done ? '✓' : '';
    scb.onclick = ()=> markSubtaskDone(g, s, !s.done);
    row.appendChild(scb);
    const lbl = document.createElement('div');
    lbl.className = 'label' + (s.done?' struck':'');
    lbl.textContent = s.title;
    lbl.onclick = ()=> markSubtaskDone(g, s, !s.done);
    row.appendChild(lbl);
    // Deadlines are normally hidden — only shown when this subtask actually has one set.
    if(s.due){
      const db = document.createElement('span');
      db.className = 'due' + (!s.done && s.due < nowStr ? ' overdue' : '');
      db.textContent = fmtDateTime(s.due);
      row.appendChild(db);
    }
    const rm = document.createElement('button');
    rm.className = 'rm'; rm.textContent = '✕'; rm.title = 'Remove subtask';
    rm.onclick = ()=> removeSubtask(g, s.id);
    row.appendChild(rm);
    subs.appendChild(row);
  }
  el.appendChild(subs);

  if(!hideSubtaskBar){
    const addRow = document.createElement('div');
    addRow.className = 'subtask-add-row';
    addRow.innerHTML = `<input type="text" class="subtask-add-input" placeholder="+ add subtask, press Enter">`;
    const addInput = addRow.querySelector('input');
    addInput.dataset.gid = g.id;
    addInput.onkeydown = (e)=>{
      if(e.key==='Enter'){
        e.preventDefault();
        addSubtaskInline(g, addInput.value);
        addInput.value = '';
      }
    };
    el.appendChild(addRow);
  }

  return el;
}

// The "logical now" for the sidebar, honoring this vault's day-reset time.
// If the clock hasn't hit that time yet, we're still logically in
// yesterday (e.g. reset time 6:00 AM, it's 2:00 AM -> still "yesterday").
function logicalNow(){
  const now = new Date();
  const [hh, mm] = (dayResetTime || '00:00').split(':').map(Number);
  const resetMoment = new Date(now);
  resetMoment.setHours(hh, mm, 0, 0);
  if(now < resetMoment){
    const y = new Date(now);
    y.setDate(y.getDate()-1);
    return y;
  }
  return now;
}
function logicalTodayKey(){
  return DOW_TO_KEY[logicalNow().getDay()];
}
// ISO date of the Monday that starts the current logical week — used to
// detect "this weekday has come back around" for the sidebar's weekly reset.
function currentWeekAnchorISO(){
  const d = logicalNow();
  const dow = d.getDay(); // 0=Sun..6=Sat
  const diffToMonday = (dow===0) ? 6 : dow-1;
  const monday = new Date(d);
  monday.setDate(monday.getDate() - diffToMonday);
  return isoOf(monday);
}
// A day's tasklist should start fresh each time that weekday comes back
// around — otherwise a task checked off last Monday would still show
// checked next Monday. Tracks, per weekday, which week it was last reset
// for for; resets that day's items the first time it's touched in a new week.
function checkWeeklySidebarReset(){
  const anchor = currentWeekAnchorISO();
  // First time this vault has seen this feature at all (a fresh vault, or
  // one saved before it existed) — stamp every day at the current week
  // without wiping anything the person already has checked off.
  if(Object.keys(dayWeekAnchor).length === 0){
    for(const k of DAY_KEYS) dayWeekAnchor[k] = anchor;
    save();
    return;
  }
  const key = logicalTodayKey();
  if(dayWeekAnchor[key] === anchor) return;
  dayWeekAnchor[key] = anchor;
  if((sidebarNotes[key]||[]).some(it=>it.done)){
    sidebarNotes[key].forEach(it=> it.done=false);
  }
  save();
}

// Drag-and-drop tab reordering: moves the dragged tab to sit where the
// drop-target tab was, persists the new order, then re-renders.
function reorderVaultTab(draggedId, targetId){
  const fromIdx = vaults.findIndex(v=>v.id===draggedId);
  const toIdx = vaults.findIndex(v=>v.id===targetId);
  if(fromIdx===-1 || toIdx===-1) return;
  const [moved] = vaults.splice(fromIdx,1);
  vaults.splice(toIdx,0,moved);
  if(hasNative && typeof window.cadenceBridge.reorderVaults === 'function'){
    window.cadenceBridge.reorderVaults(vaults.map(v=>v.id));
  } else if(!hasNative){
    saveLocalMeta();
  }
  renderTabsBar();
}

// In-app replacement for the browser's confirm() box: it matches the app theme,
// and — unlike the native box — can't leave the window with dead text fields
// afterwards (a known Electron problem on Windows). Resolves true / false.
function askConfirm({title, message, confirmLabel = 'OK', cancelLabel = 'Cancel', danger = true}){
  return new Promise((resolve) => {
    const prevFocus = document.activeElement;
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.id = 'confirmOverlay';
    const box = document.createElement('div');
    box.className = 'modal';
    box.style.maxWidth = '380px';
    box.setAttribute('role', 'alertdialog');
    box.setAttribute('aria-modal', 'true');
    const h = document.createElement('h2');
    h.textContent = title;
    const p = document.createElement('p');
    p.className = 'confirm-msg';
    p.textContent = message;
    const actions = document.createElement('div');
    actions.className = 'modal-actions';
    const cancel = document.createElement('button');
    cancel.className = 'btn';
    cancel.textContent = cancelLabel;
    const ok = document.createElement('button');
    ok.className = 'btn ' + (danger ? 'danger-fill' : 'primary');
    ok.textContent = confirmLabel;
    actions.append(cancel, ok);
    box.append(h, p, actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    function finish(result){
      document.removeEventListener('keydown', onKey, true);
      overlay.remove();
      if(prevFocus && typeof prevFocus.focus === 'function' && document.contains(prevFocus)) prevFocus.focus();
      resolve(result);
    }
    function onKey(e){
      if(e.key === 'Escape'){ e.preventDefault(); finish(false); }
    }
    document.addEventListener('keydown', onKey, true);
    cancel.onclick = () => finish(false);
    ok.onclick = () => finish(true);
    // Focus the safe choice so a stray Enter can't delete anything.
    (danger ? cancel : ok).focus();
  });
}
function closeAnyMenu(){ document.querySelectorAll('.tabmenu').forEach(m=>m.remove()); }
// A single persistent pair of listeners (registered once, below) handles
// closing any open .tabmenu on an outside click — rather than attaching a
// fresh listener pair every time a menu opens, which could linger if a menu
// was dismissed by clicking one of its own buttons instead of clicking away.
let menuArmed = false;
function positionMenu(menu, x, y){
  menuArmed = false;
  document.body.appendChild(menu);
  x -= window.scrollX; y -= window.scrollY;   // callers pass page coordinates; the menu is position:fixed
  const vw = window.innerWidth, vh = window.innerHeight;
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.min(x, vw - r.width - 8) + 'px';
  menu.style.top = Math.min(y, vh - r.height - 8) + 'px';
  setTimeout(()=>{ menuArmed = true; }, 0);
}
document.addEventListener('click', (ev)=>{
  if(!menuArmed) return;
  document.querySelectorAll('.tabmenu').forEach(m=>{ if(!m.contains(ev.target)) m.remove(); });
});
document.addEventListener('contextmenu', (ev)=>{
  if(!menuArmed) return;
  document.querySelectorAll('.tabmenu').forEach(m=>{ if(!m.contains(ev.target)) m.remove(); });
});
function openAddTabMenu(e, anchor){
  closeAnyMenu();
  if(!hasNative && !hasFSA){ memoryAddNamed(); return; }
  const menu = document.createElement('div');
  menu.className = 'tabmenu';
  menu.innerHTML = `<button id="tmOpen">Open existing file…</button><button id="tmNew">Create new file…</button>`;
  const r = anchor.getBoundingClientRect();
  positionMenu(menu, r.left + window.scrollX, r.bottom + window.scrollY + 4);
  menu.querySelector('#tmOpen').onclick = ()=>{ menu.remove(); addExistingTab(); };
  menu.querySelector('#tmNew').onclick = ()=>{ menu.remove(); addNewTab(); };
}
// Right-click a tab: "Remove tab" just untracks it (file untouched on disk).
// "Delete file" additionally deletes the underlying file — only offered
// when this tab is actually connected to a real file.
function openTabContextMenu(e, v){
  e.preventDefault();
  closeAnyMenu();
  const connected = (hasNative && !!v.path) || (hasFSA && !!fsaHandles.get(v.id));
  const menu = document.createElement('div');
  menu.className = 'tabmenu';
  if(hasNative || hasFSA){
    menu.innerHTML = `<button id="ctxRemove">Remove tab</button>` +
      (connected ? `<button id="ctxDelete" class="danger-item">Delete file…</button>` : '');
  } else {
    menu.innerHTML = `<button id="ctxRemove">Remove list</button>`;
  }
  positionMenu(menu, e.clientX + window.scrollX, e.clientY + window.scrollY);
  menu.querySelector('#ctxRemove').onclick = ()=>{ menu.remove(); closeTab(v.id); };
  const del = menu.querySelector('#ctxDelete');
  if(del) del.onclick = ()=>{ menu.remove(); deleteTabAndFile(v.id); };
}

// ---------- generic vault controller (dispatches to the right backend) ----------
function applyLoadedContent(text){
  const parsed = parseFile(text || '');
  tasks = parsed.tasks;
  sidebarNotes = parsed.sidebarNotes;
  dayResetTime = parsed.dayResetTime || '00:00';
  completedTtlHours = parsed.completedTtlHours || 0;
  hideDailySidebar = !!parsed.hideDailySidebar; hideSubtaskBar = !!parsed.hideSubtaskBar; dayWeekAnchor = parsed.dayWeekAnchor || {}; viewPrefs = parsed.viewPrefs || defaultViewPrefs();
  runAutoResets(false);
  runCompletedCleanup();
  render();
}
function ensureAtLeastOneVault(){
  if(!vaults.length){
    const id = uid();
    vaults = [{id, name:'Untitled'}];
    activeVaultId = id;
    tasks = [];
    sidebarNotes = defaultNotes();
    dayResetTime = '00:00';
    completedTtlHours = 0;
    hideDailySidebar = false;
    hideSubtaskBar = false;
    dayWeekAnchor = {};
    viewPrefs = defaultViewPrefs();
  }
  if(!activeVaultId || !vaults.find(v=>v.id===activeVaultId)){
    activeVaultId = vaults[0].id;
  }
}
async function bootVaults(){
  if(hasNative) await nativeBootLoad();
  else if(hasFSA) await fsaBootLoad();

async function fsaBootLoad(){
  const meta = loadLocalMeta();
  if(meta && meta.vaults && meta.vaults.length){

    activeVaultId = (meta.activeVaultId && meta.vaults.find(v=>v.id===meta.activeVaultId)) ? meta.activeVaultId : meta.vaults[0].id;
  } else {
    const id = uid();

    const legacyHandle = await loadHandle('vault');
    if(legacyHandle){ await storeHandle(id, legacyHandle); }
    const legacyCache = localStorage.getItem('cadence_cache');
    if(legacyCache) localStorage.setItem(cacheKey(id), legacyCache);
    saveLocalMeta();
  }
  await fsaLoadActive();

async function fsaLoadActive(){
  const v = activeVault();
  if(!v) return;
  const handle = await loadHandle(v.id);
  if(!handle){
    const cached = localStorage.getItem(cacheKey(v.id));
    const parsed = parseFile(cached || '');
    tasks = parsed.tasks; sidebarNotes = parsed.sidebarNotes; dayResetTime = parsed.dayResetTime || '00:00'; completedTtlHours = parsed.completedTtlHours || 0; hideDailySidebar = !!parsed.hideDailySidebar; hideSubtaskBar = !!parsed.hideSubtaskBar; dayWeekAnchor = parsed.dayWeekAnchor || {}; viewPrefs = parsed.viewPrefs || defaultViewPrefs();
    runAutoResets(false);
    runCompletedCleanup();
    return;
  }
  try{
    const perm = await handle.queryPermission({mode:'readwrite'});
    if(perm === 'granted'){
      fsaHandles.set(v.id, handle);
      const file = await handle.getFile();
      const parsed = parseFile(await file.text());
      tasks = parsed.tasks; sidebarNotes = parsed.sidebarNotes; dayResetTime = parsed.dayResetTime || '00:00'; completedTtlHours = parsed.completedTtlHours || 0; hideDailySidebar = !!parsed.hideDailySidebar; hideSubtaskBar = !!parsed.hideSubtaskBar; dayWeekAnchor = parsed.dayWeekAnchor || {}; viewPrefs = parsed.viewPrefs || defaultViewPrefs();
      runAutoResets(false);
      runCompletedCleanup();
    } else {
      const cached = localStorage.getItem(cacheKey(v.id));
      const parsed = parseFile(cached || '');
      tasks = parsed.tasks; sidebarNotes = parsed.sidebarNotes; dayResetTime = parsed.dayResetTime || '00:00'; completedTtlHours = parsed.completedTtlHours || 0; hideDailySidebar = !!parsed.hideDailySidebar; hideSubtaskBar = !!parsed.hideSubtaskBar; dayWeekAnchor = parsed.dayWeekAnchor || {}; viewPrefs = parsed.viewPrefs || defaultViewPrefs();

      runCompletedCleanup();
    }
  }catch(e){}
}

// ---------- persistence (writes whichever vault was ACTIVE at the moment
// save() was called, captured synchronously — NOT whatever happens to be
// active by the time the debounce timer fires. Without this, quickly
// switching tabs right after an edit would silently write the new tab's
// (wrong) content over the old tab's cache, or lose the edit entirely. ----------
let saveTimer = null;
function persistVault(v, text){
  (async ()=>{
    if(hasNative && v && v.path){
      try{ await window.cadenceBridge.writeFile(v.path, text); }
      catch(e){ toast('Could not write to file — reopen it'); }
    } else if(hasFSA && v && fsaHandles.get(v.id)){
      try{
        const writable = await fsaHandles.get(v.id).createWritable();
        await writable.write(text);
        await writable.close();
      }catch(e){ toast('Could not write to file — reopen it'); }
    }
    if(v) localStorage.setItem(cacheKey(v.id), text);
  })();
}
let renderScheduled = false;
function scheduleRender(){
  if(renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(()=>{ renderScheduled = false; render(); });
}
// Full save: re-renders the task list/sidebar/tabs (coalesced to once per
// animation frame — see scheduleRender above), then writes to disk.
function save(){
  scheduleRender();
  const v = activeVault();
  const text = serialize();
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(()=> persistVault(v, text), 350);
}

// ---- remember FSA handles across reloads (browser only) via IndexedDB ----
function idb(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('cadence-db',1);
    r.onupgradeneeded = ()=> r.result.createObjectStore('handles');
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
async function storeHandle(id, handle){
  try{
    const db = await idb();
    const tx = db.transaction('handles','readwrite');
    tx.objectStore('handles').put(handle, id);
  }catch(e){}
}
function loadHandle(id){
  return idb().then(db=> new Promise((res)=>{
    try{
      const tx = db.transaction('handles','readonly');
      const req = tx.objectStore('handles').get(id);
      req.onsuccess = ()=> res(req.result || null);
      req.onerror = ()=> res(null);
    }catch(e){ res(null); }
  })).catch(()=>null);
}
async function forgetHandle(id){
  try{
    const db = await idb();
    const tx = db.transaction('handles','readwrite');
    tx.objectStore('handles').delete(id);
  }catch(e){}
}

          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
        </select>
      </div>
      <div class="field" id="mDaysField" style="display:none;"><label>On these days</label>
        <div class="weekdays" id="mDays">${WD.map((d,i)=>`<button type="button" class="wd" data-d="${i}">${d}</button>`).join('')}</div>
      </div>
      <div style="display:flex;gap:10px;">
        <div class="field" style="flex:1;"><label>Due date</label><input type="date" id="mDue"></div>
        <div class="field" style="flex:1;"><label id="mTimeLabel">Time</label><input type="time" id="mTime"></div>
      </div>
      <div class="modal-actions">
        ${editingId? '<button class="btn danger" id="mDelete">Delete</button>' : ''}
        <button class="btn" id="mCancel">Cancel</button>
        <button class="btn primary" id="mSave">Save</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#mTitle').value = data.title;
  overlay.querySelector('#mComment').value = data.comment || '';
  overlay.querySelector('#mRepeat').value = data.repeat;
  overlay.querySelector('#mDue').value = data.due || '';
  overlay.querySelector('#mTime').value = data.time || '00:00';
  const daysField = overlay.querySelector('#mDaysField');
  const daysWrap = overlay.querySelector('#mDays');
  const timeLabel = overlay.querySelector('#mTimeLabel');
  let selDays = new Set(data.days);
  function syncDaysUI(){
    const isRepeating = overlay.querySelector('#mRepeat').value !== 'none';
    daysField.style.display = overlay.querySelector('#mRepeat').value==='weekly' ? 'block':'none';
    timeLabel.textContent = isRepeating ? 'Reset time' : 'Due time';
    [...daysWrap.children].forEach(b=> b.classList.toggle('on', selDays.has(Number(b.dataset.d))));
  }
  syncDaysUI();
  overlay.querySelector('#mRepeat').onchange = syncDaysUI;
  daysWrap.onclick = (e)=>{
    const b = e.target.closest('.wd'); if(!b) return;
    const d = Number(b.dataset.d);
    if(selDays.has(d)) selDays.delete(d); else selDays.add(d);
    syncDaysUI();
  };

  // ---- subtask editor: full CRUD lives here now, not on the main page ----
  let modalSubs = data.subtasks.map(s=>({...s}));
  const subEditor = overlay.querySelector('#mSubEditor');
  function renderSubEditor(){
    subEditor.innerHTML = '';
    if(!modalSubs.length){
      subEditor.innerHTML = '<div class="sub-empty">No subtasks yet.</div>';
      return;
    }
    for(const s of modalSubs){
      const row = document.createElement('div');
      row.className = 'sub-row';
      const cb = document.createElement('div');
      cb.className = 'checkbox' + (s.done ? ' checked':'');
      cb.textContent = s.done ? '✓' : '';
      cb.onclick = ()=>{ s.done = !s.done; renderSubEditor(); };
      row.appendChild(cb);
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.value = s.title;
      inp.oninput = ()=>{ s.title = inp.value; };
      row.appendChild(inp);
      const dueBtn = document.createElement('button');
      dueBtn.type = 'button';
      dueBtn.className = 'sub-due-btn' + (s.due ? ' has-due' : '');
      dueBtn.textContent = '📅';
      dueBtn.title = s.due ? ('Deadline: ' + fmtDateTime(s.due)) : 'Set deadline';
      dueBtn.onclick = (e)=>{
        e.stopPropagation();
        openSubDuePopover(dueBtn, s.due, (val)=>{ s.due = val; renderSubEditor(); });
      };
      row.appendChild(dueBtn);
      const rm = document.createElement('button');
      rm.className = 'rm'; rm.textContent = '✕'; rm.title = 'Remove subtask';
      rm.onclick = ()=>{ modalSubs = modalSubs.filter(x=>x!==s); renderSubEditor(); };
      row.appendChild(rm);
      subEditor.appendChild(row);
    }
  }
  renderSubEditor();
  const subAddInput = overlay.querySelector('#mSubAdd');
  subAddInput.onkeydown = (e)=>{
    if(e.key==='Enter'){
      e.preventDefault();
      if(subAddInput.value.trim()){
        modalSubs.push({id:uid(), title:subAddInput.value.trim(), done:false, due:null});
        subAddInput.value='';
        renderSubEditor();
      }
    }
  };

  overlay.querySelector('#mCancel').onclick = ()=> overlay.remove();
  if(editingId){
    // Completed tasks skip the "are you sure" — same reasoning as the
    // main-page delete button.
    overlay.querySelector('#mDelete').onclick = async ()=>{
      const g = tasks.find(x=>x.id===editingId);
      if((g && g.archived) || await askConfirm({
        title: 'Delete task?',
        message: g ? '\u201c' + g.title + '\u201d will be deleted. This cannot be undone.' : 'This task will be deleted. This cannot be undone.',
        confirmLabel: 'Delete'
      })){ deleteGroup(editingId); overlay.remove(); }
    };
  }
  overlay.querySelector('#mSave').onclick = ()=>{
    const title = overlay.querySelector('#mTitle').value.trim();
    if(!title){ toast('Title required'); return; }
    // Commit any text still sitting in the "+ add subtask" box that the
    // user never pressed Enter on — otherwise it's silently lost.
    if(subAddInput.value.trim()){
      modalSubs.push({id:uid(), title:subAddInput.value.trim(), done:false, due:null});
      subAddInput.value = '';
    }
    const comment = overlay.querySelector('#mComment').value.trim();
    const repeat = overlay.querySelector('#mRepeat').value;
    let due = overlay.querySelector('#mDue').value || null;
    const time = overlay.querySelector('#mTime').value || '00:00';
    // A repeating task always needs a due date to reset against — without
    // one it would never trip the auto-reset check and would just sit
    // completed forever.
    if(repeat!=='none' && !due) due = todayISO();
    const finalSubs = modalSubs.filter(s=>s.title.trim()).map(s=>({id:s.id||uid(), title:s.title.trim(), done:!!s.done, due:s.due||null}));
    if(editingId){
      const g = tasks.find(x=>x.id===editingId);
      g.title = title; g.repeat = repeat; g.days = [...selDays]; g.due = due; g.time = time;
      g.comment = comment; g.subtasks = finalSubs;
    } else {
      tasks.push({
        id: uid(), title, repeat, days:[...selDays], due, time, comment,
        history: [], archived:false, completed:false, completedAt: null,
        subtasks: finalSubs
      });
    }
    save();
    overlay.remove();
  };
}

document.getElementById('btnAdd').onclick = openAdd;
document.getElementById('btnQuickAdd').onclick = openQuickAdd;
document.getElementById('btnSettings').onclick = openTabSettings;
applyTheme();

// ---------- version label + update checker ----------
async function initVersionLabel(){
  try{
    if(window.cadenceBridge && typeof window.cadenceBridge.getAppVersion === 'function'){
      const v = await window.cadenceBridge.getAppVersion();
      if(v) appVersion = String(v);
    }
  }catch(e){}
  const el = document.getElementById('appVersion');
  if(el) el.textContent = 'v' + appVersion;
}

// Only active inside the Electron app (that's where the bridge exists). It
// never downloads anything itself — it opens the installer link in the browser.
const UPD_DISMISS_KEY = 'cadence_update_dismissed';
let updBusy = false;
function updEl(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
const updClean = (t) => String(t || '').replace(/^v/i, '');
function updReadDismissed(){ try{ return localStorage.getItem(UPD_DISMISS_KEY); }catch(e){ return null; } }
function updWriteDismissed(v){ try{ localStorage.setItem(UPD_DISMISS_KEY, v); }catch(e){} }
async function updRunCheck(){
  try{ return await window.cadenceBridge.checkForUpdates(); }
  catch(e){ return { ok: false, error: 'network' }; }
}
async function updOpenUrl(url){
  const bridge = window.cadenceBridge;
  if(!url || !bridge || typeof bridge.openUpdateUrl !== 'function') return false;
  try{ return !!(await bridge.openUpdateUrl(url)); }catch(e){ return false; }
}
function updStatusText(res){
  if(!res.ok){
    return res.error === 'rate-limited'
      ? 'GitHub is limiting requests from this connection right now. Try again in a while.'
      : "Couldn't reach GitHub. Check your internet connection and try again.";
  }
  if(res.none) return 'No releases have been published yet.';
  if(res.newer) return 'Cadence ' + updClean(res.latest) + ' is available.';
  return "You're on the latest version.";
}
function removeUpdateBanner(){
  const b = document.getElementById('cduBanner');
  if(b) b.remove();
}
function showUpdateBanner(res){
  removeUpdateBanner();
  const banner = updEl('div', 'cdu-banner');
  banner.id = 'cduBanner';
  banner.appendChild(updEl('div', 'cdu-msg',
    'Cadence ' + updClean(res.latest) + ' is available' + (appVersion ? ' (you have ' + appVersion + ')' : '') + '.'));
  const primary = updEl('button', 'btn primary', res.downloadUrl ? 'Download installer' : 'View release');
  primary.onclick = () => updOpenUrl(res.downloadUrl || res.releaseUrl);
  banner.appendChild(primary);
  if(res.downloadUrl && res.releaseUrl){
    const notes = updEl('button', 'btn', 'Release notes');
    notes.onclick = () => updOpenUrl(res.releaseUrl);
    banner.appendChild(notes);
  }
  const x = updEl('button', 'btn', '✕');
  x.title = 'Dismiss';
  x.onclick = () => { updWriteDismissed(res.latest); removeUpdateBanner(); };
  banner.appendChild(x);
  const toolbar = document.getElementById('toolbar');
  if(toolbar && toolbar.parentNode) toolbar.parentNode.insertBefore(banner, toolbar);
  else (document.querySelector('.wrap') || document.body).prepend(banner);
}
function openUpdateDialog(){
  if(document.getElementById('cduOverlay')) return;
  const ov = updEl('div', 'overlay');
  ov.id = 'cduOverlay';
  const box = updEl('div', 'modal cdu-box');
  box.style.maxWidth = '380px';
  box.appendChild(updEl('h2', null, 'Updates'));
  const row = (label, value) => {
    const r = updEl('div', 'cdu-row');
    r.appendChild(updEl('span', null, label));
    const v = updEl('span', null, value);
    r.appendChild(v);
    box.appendChild(r);
    return v;
  };
  row('Installed', appVersion ? 'v' + appVersion : 'unknown');
  const latestVal = row('Latest release', '—');
  const status = updEl('div', 'cdu-status', 'Checking…');
  box.appendChild(status);
  const actions = updEl('div', 'modal-actions cdu-actions');
  box.appendChild(actions);
  ov.appendChild(box);
  document.body.appendChild(ov);

  function close(){ document.removeEventListener('keydown', onKey); ov.remove(); }
  function onKey(e){ if(e.key === 'Escape') close(); }
  document.addEventListener('keydown', onKey);

  function renderActions(res, checkDisabled){
    actions.innerHTML = '';
    const closeBtn = updEl('button', 'btn', 'Close');
    closeBtn.onclick = close;
    actions.appendChild(closeBtn);
    const again = updEl('button', 'btn', 'Check again');
    again.disabled = !!checkDisabled;
    again.onclick = check;
    actions.appendChild(again);
    if(res && res.ok && !res.none){
      if(res.releaseUrl){
        const notes = updEl('button', 'btn', 'Release notes');
        notes.onclick = () => updOpenUrl(res.releaseUrl);
        actions.appendChild(notes);
      }
      if(res.newer){
        const dl = updEl('button', 'btn primary', res.downloadUrl ? 'Download installer' : 'View release');
        dl.onclick = () => updOpenUrl(res.downloadUrl || res.releaseUrl);
        actions.appendChild(dl);
      }
    }
  }
  async function check(){
    if(updBusy) return;
    updBusy = true;
    status.textContent = 'Checking…';
    renderActions(null, true);
    const res = await updRunCheck();
    updBusy = false;
    if(!document.getElementById('cduOverlay')) return;   // closed while checking
    latestVal.textContent = (res.ok && !res.none) ? 'v' + updClean(res.latest) : '—';
    status.textContent = updStatusText(res);
    renderActions(res, false);
  }
  check();
}
function initUpdater(){
  const bridge = window.cadenceBridge;
  if(!bridge || typeof bridge.checkForUpdates !== 'function') return;
  const footer = updEl('div', 'cdu-footer');
  footer.appendChild(document.createTextNode('Cadence v' + appVersion + ' · '));
  const link = updEl('button', null, 'Check for updates');
  link.onclick = openUpdateDialog;
  footer.appendChild(link);
  (document.querySelector('.wrap') || document.body).appendChild(footer);
  // Quiet check shortly after launch; only speaks up when there is something
  // new that hasn't already been dismissed.
  setTimeout(async () => {
    const res = await updRunCheck();
    if(res.ok && res.newer && updReadDismissed() !== res.latest) showUpdateBanner(res);
  }, 3000);
}

// ---------- boot ----------
(async function init(){
  await bootVaults();
  render();
  await initVersionLabel();
  initUpdater();

  setInterval(()=> { runAutoResets(true); runCompletedCleanup(); }, 60*1000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') runAutoResets(true);
  });
})();
</script>
